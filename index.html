<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventarizatsiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#047575;--teal-d:#035959;--tint:#7FB8B8;--wash:#E3F0F0;--bg:#fff;--paper:#fff;--ink:#023B3B;--mute:#3F7373;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px clamp(14px,3vw,32px);background:var(--paper);border-bottom:1px solid var(--tint)}
header img{width:44px;height:auto;display:block}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:13px}
.sp{flex:1}
.btn{border:1.5px solid var(--teal);background:var(--paper);color:var(--teal-d);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.fill{background:var(--teal);color:var(--on)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;padding:24px clamp(14px,3vw,32px);align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.box{background:var(--paper);border:1px solid var(--tint);border-radius:12px;padding:16px}
.drop{border:2px dashed var(--tint);text-align:center;cursor:pointer;background:var(--paper)}
.drop.over{background:var(--wash);border-color:var(--teal)}
.drop b{display:block;font-size:16px}
.drop span{color:var(--mute);font-size:13px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
#scan{width:100%;font-size:22px;font-weight:600;padding:14px;border:2.5px solid var(--teal);border-radius:10px;background:var(--paper)}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#vid{width:100%;border-radius:10px;margin-top:10px;max-height:220px;object-fit:cover;background:var(--wash)}
.last{background:var(--paper);color:var(--ink);border:2px solid var(--teal)}
.last .nm{font-size:17px;font-weight:600;margin:0 0 4px}
.last .cd{color:var(--mute);font-size:13px}
.last .big{color:var(--teal);font-size:56px;font-weight:700;line-height:1;margin:12px 0 10px;letter-spacing:-.03em}
.last .big small{font-size:24px;opacity:.75;font-weight:500}
.empty{color:var(--mute);margin:0}
.log h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log h2 span{font-size:12.5px;font-weight:600;color:var(--mute)}
.logl{max-height:420px;overflow-y:auto;border:1px solid var(--tint);border-radius:8px}
.lr{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--wash);font-size:13.5px}
.lr:first-child{border-top:0}
.lr:first-child{background:var(--wash)}
.lr .no{min-width:34px;color:var(--mute);font-weight:700}
.lr .tx{flex:1;min-width:0}
.lr .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .tx small{color:var(--mute)}
.lr .tm{color:var(--mute);font-size:12px;white-space:nowrap}
.lr .dd{font-weight:700;min-width:28px;text-align:right}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;border:2px solid transparent}
.s-ok{background:var(--teal);color:var(--on);border-color:var(--teal)}
.s-kam{background:var(--wash);color:var(--ink);border-color:var(--tint)}
.s-kop{background:var(--paper);color:var(--ink);border-color:var(--teal)}
.s-yoq{background:var(--paper);color:var(--ink);border:2px dashed var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{text-align:left;cursor:pointer;background:var(--paper);border:1.5px solid var(--tint);border-radius:12px;padding:12px 14px}
.stat[aria-pressed=true]{border-color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal);background:var(--wash)}
.stat .n{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--mute)}
.bar{height:10px;border-radius:9px;background:var(--wash);overflow:hidden;margin:6px 0 0}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:180px;padding:9px 12px;border:1.5px solid var(--tint);border-radius:8px;background:var(--paper)}
.wrap{overflow-x:auto;border:1px solid var(--tint);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:860px}
th{background:var(--wash);color:var(--teal-d);border-bottom:2px solid var(--teal);text-align:left;font-weight:600;padding:9px 10px;font-size:13px;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--wash);vertical-align:middle}
tr:nth-child(even) td{background:#F7FBFB}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.nm{max-width:300px;font-weight:500}
.mini{border:1.5px solid var(--tint);background:var(--paper);border-radius:6px;width:28px;height:28px;cursor:pointer;font-weight:700;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:var(--on);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.homewrap{padding:28px clamp(14px,3vw,32px)}
.ht{font-size:22px;margin:0 0 16px}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.bcard{text-align:left;cursor:pointer;background:var(--paper);border:1.5px solid var(--tint);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.bcard:hover{border-color:var(--teal)}
.bcard h3{margin:0;font-size:19px}
.bcard .sub{color:var(--mute);font-size:13px;min-height:19px}
.bcard .big{font-size:36px;font-weight:700;color:var(--teal);line-height:1.1}
.bcard .big small{font-size:15px;color:var(--mute);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px clamp(14px,3vw,32px) 0}
.bar2 h2{margin:0;font-size:20px}
#rn{padding:8px 12px;border:1.5px solid var(--teal);border-radius:8px;font-size:16px}
</style>
</head>

const $=s=>document.querySelector(s);
const fmt=n=>(n==null||n==='')?'—':Number(n).toLocaleString('ru-RU');
const LBL={ok:"To'g'ri",kam:"Kam",kop:"Ko'p",yoq:"Bazada yo'q"};
const SYM={ok:'✓',kam:'−',kop:'+',yoq:'?'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IDS=['b1','b2','b3','b4'];
const B=Object.fromEntries(IDS.map((id,i)=>[id,{id,def:`${i+1}-filial`,title:`${i+1}-filial`,base:[],counts:{},who:{},fname:'',kind:'old',sid:'0',nch:0,last:null,log:[],subd:false,unS:null}]));
let cur=null,filter='all',q='',db=null,usr=null,dl=null,uid=null,canW=true,canE=false;
const S=()=>B[cur],P=id=>'branches/'+id;
const labs=b=>b.kind==='new'?{code:'SKU kodi',price:'Chakana narxi'}:{code:'Kodi',price:'Sotuv narxi'};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function beep(ok){try{const a=beep.a||(beep.a=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?880:220;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(ok?.08:.25))}catch(e){}}

function rows(b){
  const m=Object.fromEntries(b.base.map(x=>[x.code,1])),out=[];
  Object.keys(b.counts).forEach(c=>{if(!m[c])out.push({code:c,name:"Bazada yo'q",group:'—',cost:null,price:null,qty:0,inBase:false,scan:b.counts[c]})});
  b.base.forEach(x=>out.push({...x,inBase:true,scan:b.counts[x.code]||0}));
  out.forEach(r=>{r.st=!r.inBase?'yoq':r.scan===r.qty?'ok':r.scan>r.qty?'kop':'kam'});
  return out.filter(r=>!(r.inBase&&r.qty===0&&r.scan===0));
}
const tally=R=>{const c={all:R.length,ok:0,kam:0,kop:0,yoq:0};R.forEach(r=>c[r.st]++);return c};

function render(){cur?renderDetail():renderHome()}
function renderHome(){
  $('#branches').innerHTML=IDS.map(id=>{
    const b=B[id],R=rows(b),c=tally(R),tot=b.base.reduce((s,x)=>s+x.qty,0),sc=R.reduce((s,r)=>s+r.scan,0);
    return `<button class="bcard" data-b="${id}"><h3>${esc(b.title)}</h3><div class="sub">${b.base.length?esc(b.fname)+' · '+b.base.length+' ta tovar':'Baza yuklanmagan'}</div><div class="big">${sc}<small> / ${tot} dona</small></div><div class="bar"><i style="width:${tot?Math.min(100,sc/tot*100):0}%"></i></div><div class="chips"><span class="chip s-ok">✓ ${c.ok}</span><span class="chip s-kam">− ${c.kam}</span><span class="chip s-kop">+ ${c.kop}</span><span class="chip s-yoq">? ${c.yoq}</span></div></button>`}).join('');
}
function renderDetail(){
  const b=S(),R=rows(b),c=tally(R);
  $('#bt').textContent=b.title;$('#thCode').textContent=labs(b).code;$('#thPrice').textContent=labs(b).price;
  const items=[['all','Jami qator'],['ok',"To'g'ri"],['kam','Kam'],['kop',"Ko'p"],['yoq',"Bazada yo'q"]];
  $('#stats').innerHTML=items.map(([k,l])=>`<button class="stat" data-f="${k}" aria-pressed="${filter===k}"><div class="n">${c[k]}</div><div class="l">${k==='all'?l:SYM[k]+' '+l}</div></button>`).join('');
  const tot=b.base.reduce((s,x)=>s+x.qty,0),sc=R.reduce((s,r)=>s+r.scan,0);
  $('#prog').innerHTML=`<b>Skan qilingan: ${fmt(sc)} dona</b> <span style="color:var(--mute)">/ bazada ${fmt(tot)} dona</span><div class="bar"><i style="width:${tot?Math.min(100,sc/tot*100):0}%"></i></div>`;
  const qq=q.toLowerCase();
  const list=R.filter(r=>(filter==='all'||r.st===filter)&&(!qq||(r.name+' '+r.code+' '+r.group).toLowerCase().includes(qq)));
  $('#tb').innerHTML=list.length?list.map(r=>`<tr><td><span class="chip s-${r.st}">${SYM[r.st]} ${LBL[r.st]}</span></td><td class="nm">${esc(r.name)}</td><td>${esc(r.code)}</td><td>${esc(r.group)}</td><td class="r">${fmt(r.cost)}</td><td class="r">${fmt(r.price)}</td><td class="r">${r.inBase?r.qty:'—'}</td><td class="r"><b>${r.scan}</b></td><td>${canW?`<button class="mini" data-m="${esc(r.code)}" aria-label="Skanni 1 ga kamaytirish">−</button>`:''}</td></tr>`).join(''):`<tr><td colspan="9" class="empty" style="padding:24px">${b.base.length?"Bu filtr bo'yicha tovar yo'q.":'Boshlash uchun baza faylini yuklang.'}</td></tr>`;
  $('#dropT').textContent=b.base.length?'Bazani almashtirish':'Baza faylini tashlang';
  $('#dropS').textContent=b.base.length?`${b.fname} · ${b.base.length} ta tovar`:'Excel (.xlsx) faylni bu yerga tashlang yoki bosib tanlang';
  const lr=b.last&&R.find(r=>r.code===b.last);
  $('#last').innerHTML=lr?`<p class="nm">${esc(lr.name)}</p><div class="cd">Kod: ${esc(lr.code)}${lr.inBase?' · '+esc(lr.group):''}</div><div class="big">${lr.scan}<small> / ${lr.inBase?lr.qty:'?'}</small></div><span class="chip s-${lr.st}">${SYM[lr.st]} ${LBL[lr.st]}</span>`:`<p class="empty">Skanerlangan tovar shu yerda ko'rinadi.</p>`;
  renderLog(b);
}
function renderLog(b){
  const L=b.log,el=$('#log'),nm=Object.fromEntries(b.base.map(x=>[x.code,x.name])),tf=t=>new Date(t).toLocaleTimeString('uz-UZ',{hour12:false});
  if(!L.length){el.innerHTML='<h2>Skanerlanganlar tartibi</h2><p class="empty">Hali skan qilinmagan.</p>';return}
  el.innerHTML=`<h2>Skanerlanganlar tartibi <span>jami ${L.length} ta skan</span></h2><div class="logl">`+L.map((x,i)=>({x,n:i+1})).reverse().map(({x,n})=>`<div class="lr"><span class="no">${n}.</span><span class="tx"><b>${esc(nm[x.code]||"Bazada yo'q")}</b><small>${esc(x.code)}</small></span><span class="tm">${tf(x.t)}</span><span class="dd">${x.d>0?'+'+x.d:x.d}</span></div>`).join('')+'</div>';
}

function openB(id){
  cur=id;filter='all';q='';$('#q').value='';
  $('#home').hidden=true;$('#bar2').hidden=false;$('#detail').hidden=false;$('#xlsBtn').hidden=false;$('#pdfBtn').hidden=false;
  render();renderWho();if(canW)$('#scan').focus();
}
function goHome(){
  stopCam();cur=null;
  $('#home').hidden=false;$('#bar2').hidden=true;$('#detail').hidden=true;$('#xlsBtn').hidden=true;$('#pdfBtn').hidden=true;render();
}

/* Umumiy ombor */
function addScan(code,d){
  const b=S();if(!db)return;
  db.collection(P(b.id)+'/scans').add({sid:b.sid,code,d,by:uid,t:Date.now()}).catch(e=>toast("Saqlab bo'lmadi ("+(e.code||'xato')+')'));
}
function doScan(v){
  v=String(v).trim();if(!v)return;const b=S();
  if(!b.base.length){toast('Avval baza faylini yuklang');return}
  if(!canW){toast("Sizda skan qilish huquqi yo'q");return}
  beep(b.base.some(x=>x.code===v));
  b.counts[v]=(b.counts[v]||0)+1;b.last=v;b.log.push({code:v,d:1,t:Date.now()});render();addScan(v,1);
}
function adjust(code){
  const b=S();if(!canW||!(b.counts[code]>0))return;
  b.counts[code]--;if(!b.counts[code])delete b.counts[code];b.log.push({code,d:-1,t:Date.now()});render();addScan(code,-1);
}
function subScans(b){
  b.unS&&b.unS();
  b.unS=db.collection(P(b.id)+'/scans').where('sid','==',b.sid).onSnapshot(sn=>{
    const c={},w={};let top=null;
    sn.docs.forEach(d=>{const x=d.data();c[x.code]=(c[x.code]||0)+x.d;
      const u=w[x.by]||(w[x.by]={n:0,t:0});u.n+=x.d;u.t=Math.max(u.t,x.t);
      if(x.d>0&&(!top||x.t>top.t))top=x});
    Object.keys(c).forEach(k=>{if(c[k]<=0)delete c[k]});
    b.counts=c;b.who=w;b.log=sn.docs.map(d=>d.data()).sort((x,y)=>x.t-y.t);if(top)b.last=top.code;render();if(cur===b.id)renderWho();
  },e=>toast("Skanlarni o'qib bo'lmadi ("+(e.code||'xato')+')'));
}
function subBranch(b){
  db.collection(P(b.id)+'/setup').onSnapshot(sn=>{
    const ch=[];let m={};
    sn.docs.forEach(d=>{if(d.id==='meta')m=d.data();else ch.push(d.data())});
    b.base=ch.sort((x,y)=>x.i-y.i).flatMap(x=>x.items||[]);b.nch=ch.length;
    b.fname=m.fname||'';b.kind=m.kind||'old';b.title=m.title||b.def;
    const ns=m.sid||'0';if(!b.subd||ns!==b.sid){b.subd=true;b.sid=ns;subScans(b)}
    render();
  },e=>toast("Bazani o'qib bo'lmadi ("+(e.code||'xato')+')'));
}
const setMeta=(b,p)=>db.doc(P(b.id)+'/setup/meta').set({fname:b.fname,kind:b.kind,sid:b.sid,title:b.title,...p});
async function pushBase(items,name,kind){
  const b=S(),n=Math.ceil(items.length/300);
  for(let i=0;i<n;i++)await db.doc(P(b.id)+'/setup/c'+i).set({i,items:items.slice(i*300,(i+1)*300)});
  for(let i=n;i<b.nch;i++)await db.doc(P(b.id)+'/setup/c'+i).delete().catch(()=>{});
  await setMeta(b,{fname:name,kind});
}
async function newCount(){try{await setMeta(S(),{sid:Date.now().toString(36)});toast('Yangi sanoq boshlandi')}catch(e){toast("Boshlab bo'lmadi")}}
async function renderWho(){
  if(!cur)return;const w=S().who,ids=Object.keys(w),el=$('#who');
  if(!ids.length){el.hidden=true;return}
  let Pf={};try{if(usr)Pf=await usr.profiles(ids)}catch(e){}
  if(!cur)return;
  el.hidden=false;
  el.innerHTML='<h2>Kim qancha skan qildi</h2><div class="chips">'+ids.sort((a,b)=>w[b].t-w[a].t).map(i=>`<span class="chip s-kam">${esc(i===uid?'Siz':(Pf[i]&&Pf[i].name)||'Ishtirokchi')}: ${w[i].n} dona</span>`).join('')+'</div>';
}
async function save_(filename,data){
  if(!dl){toast('Yuklab olish bu yerda mavjud emas');return}
  try{await dl.save({filename,data})}catch(e){if(e.code!=='declined')toast("Faylni saqlab bo'lmadi ("+(e.code||'xato')+')')}
}

/* Hodisalar */
let autoT;
$('#scan').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(autoT);doScan(e.target.value);e.target.value=''}});
$('#scan').addEventListener('input',e=>{
  clearTimeout(autoT);const el=e.target,v=el.value.trim();
  if(!cur||!v||!S().base.some(x=>x.code===v))return;
  autoT=setTimeout(()=>{if(el.value.trim()===v){doScan(v);el.value=''}},350);
});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-b]');if(g){openB(g.dataset.b);return}
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render()}
  const m=e.target.closest('[data-m]');if(m)adjust(m.dataset.m);
  if(cur&&canW&&!e.target.closest('input,button,label,a,table'))$('#scan').focus();
});
$('#back').addEventListener('click',goHome);
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
$('#clrBtn').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.arm){newCount();b.textContent='Yangi sanoq boshlash';delete b.dataset.arm;return}
  b.dataset.arm=1;b.textContent='Aniq boshlaymi? Yana bosing';
  setTimeout(()=>{b.textContent='Yangi sanoq boshlash';delete b.dataset.arm},3500);
});
$('#ren').addEventListener('click',()=>{const r=$('#rn');r.value=S().title;r.hidden=false;$('#bt').hidden=true;r.focus()});
function endRen(){$('#rn').hidden=true;$('#bt').hidden=false}
$('#rn').addEventListener('keydown',async e=>{
  if(e.key==='Escape')endRen();
  if(e.key==='Enter'){const t=e.target.value.trim();endRen();if(t){const b=S();try{await setMeta(b,{title:t})}catch(err){toast("Nomni o'zgartirib bo'lmadi")}}}
});
$('#rn').addEventListener('blur',endRen);

/* Baza yuklash */
async function load(f){
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const hi=a.findIndex(r=>r.some(c=>/^(коди|код|kod|kodi|code|sku)$/i.test(String(c).trim())));
    if(hi<0)throw new Error('Kod ustuni topilmadi');
    const h=a[hi].map(c=>String(c).trim()),ix=re=>h.findIndex(c=>re.test(c));
    const C={code:ix(/^(коди|код|kod|kodi|code|sku)$/i),name:ix(/(номи|nomi|name|наимен|^mahsulot$)/i),qty:ix(/(қолдиқ|остаток|qoldiq|ostatka|^miqdori?$)/i),cost:ix(/(таннарҳ|себестоим|tannarx|cost)/i),cost2:ix(/^oxirgi narx$/i),price:ix(/(сотиш|sotuv|sotish|цена|price|^chakana$)/i),group:ix(/(гуруҳ|групп|guruh|group|kategoriya|категор)/i)};
    if(C.name<0||C.qty<0)throw new Error('Nomi yoki qoldiq ustuni topilmadi');
    const kind=/sku/i.test(h[C.code])?'new':'old',nv=v=>(v===''||v==null)?null:(Number(String(v).replace(/\s/g,''))||0);
    const mp=new Map();
    a.slice(hi+1).forEach(r=>{
      const code=String(r[C.code]??'').trim();if(!code)return;
      const qty=Number(r[C.qty])||0;
      if(mp.has(code)){mp.get(code).qty+=qty;return}
      mp.set(code,{code,name:String(r[C.name]).trim(),group:C.group>=0?String(r[C.group]).trim():'',cost:(C.cost>=0?nv(r[C.cost]):null)??(C.cost2>=0?nv(r[C.cost2]):null),price:C.price>=0?nv(r[C.price]):null,qty});
    });
    if(!mp.size)throw new Error('Tovar topilmadi');
    await pushBase([...mp.values()],f.name,kind);
    toast(`${mp.size} ta tovar yuklandi`);$('#scan').focus();
  }catch(err){toast("Faylni o'qib bo'lmadi: "+err.message)}
}
$('#file').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);e.target.value=''});
const dz=$('#drop');
['dragover','dragenter'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}});

/* Kamera */
let stream,timer,lc='',lt=0;
if('BarcodeDetector' in window)$('#camBtn').hidden=false;
function stopCam(){clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('#vid').hidden=true;$('#camBtn').textContent='Kamera bilan skanerlash'}
$('#camBtn').addEventListener('click',async()=>{
  if(stream){stopCam();return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid');v.srcObject=stream;v.hidden=false;await v.play();
    const det=new BarcodeDetector();$('#camBtn').textContent="Kamerani o'chirish";
    timer=setInterval(async()=>{try{const r=await det.detect(v);if(r[0]){const c=r[0].rawValue,t=Date.now();if(c!==lc||t-lt>2500){lc=c;lt=t;doScan(c)}}}catch(e){}},300);
  }catch(e){stopCam();toast('Kameraga ruxsat berilmadi')}
});

/* Eksport */
const KEYS=['ok','kam','kop','yoq'];
const head=b=>{const L=labs(b);return ['Nomi',L.code,'Guruhi','Tannarxi',L.price,'Bazadagi qoldiq','Skan soni','Farq']};
const grp=b=>{const g={ok:[],kam:[],kop:[],yoq:[]};rows(b).forEach(r=>g[r.st].push([r.name,r.code,r.group,r.cost,r.price,r.inBase?r.qty:0,r.scan,r.scan-(r.inBase?r.qty:0)]));return g};
const stamp=()=>new Date().toISOString().slice(0,10);
const lat=s=>String(s??'').replace(/[ʻʼ‘’´`]/g,"'").replace(/[^\x00-\xFF]/g,'?');
const fn=b=>'Zamon_'+(lat(b.title).replace(/[^A-Za-z0-9\-]+/g,'_')||b.id)+'_'+stamp();
$('#xlsBtn').addEventListener('click',()=>{
  const b=S();if(!b.base.length){toast('Avval baza faylini yuklang');return}
  const g=grp(b),wb=XLSX.utils.book_new();
  const sum=XLSX.utils.aoa_to_sheet([['Zamon Savdo: '+b.title],['Sana',new Date().toLocaleString('ru-RU')],['Baza',b.fname],[],['Holat','Qatorlar soni'],...KEYS.map(k=>[LBL[k],g[k].length]),['Jami',KEYS.reduce((n,k)=>n+g[k].length,0)]]);
  sum['!cols']=[{wch:22},{wch:40}];XLSX.utils.book_append_sheet(wb,sum,'Xulosa');
  KEYS.forEach(k=>{
    const ws=XLSX.utils.aoa_to_sheet([head(b),...g[k]]);
    ws['!cols']=[{wch:46},{wch:12},{wch:24},{wch:12},{wch:13},{wch:16},{wch:11},{wch:8}];
    XLSX.utils.book_append_sheet(wb,ws,LBL[k]);
  });
  save_(fn(b)+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}));
});
$('#pdfBtn').addEventListener('click',()=>{
  const b=S();if(!b.base.length){toast('Avval baza faylini yuklang');return}
  try{
    const d=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),g=grp(b);
    d.addImage(LOGO,'PNG',14,9,14,15.6);
    d.setFont('helvetica','bold');d.setFontSize(17);d.setTextColor(4,117,117);d.text('Zamon Savdo: '+lat(b.title),32,16);
    d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(2,59,59);
    d.text(`Inventarizatsiya natijasi   Sana: ${new Date().toLocaleString('ru-RU')}   Baza: ${lat(b.fname)}`,32,21);
    d.text(KEYS.map(k=>`${LBL[k]}: ${g[k].length}`).join('   '),32,26);
    let y=32;
    KEYS.forEach(k=>{
      if(!g[k].length)return;
      if(y>175){d.addPage();y=14}
      d.setFont('helvetica','bold');d.setFontSize(12);d.setTextColor(4,117,117);d.text(`${lat(LBL[k])} (${g[k].length})`,14,y);
      d.autoTable({startY:y+2,margin:{left:14,right:14},head:[head(b)],body:g[k].map(r=>r.map((v,i)=>(i===3||i===4)&&v!=null?fmt(v):lat(v))),
        styles:{fontSize:8,cellPadding:1.8,textColor:[2,59,59]},headStyles:{fillColor:[4,117,117],textColor:255},alternateRowStyles:{fillColor:[227,240,240]},
        columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'}}});
      y=d.lastAutoTable.finalY+10;
    });
    const n=d.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(4,117,117);d.text(`${i} / ${n}`,283,205,{align:'right'})}
    save_(fn(b)+'.pdf',d.output('arraybuffer'));
  }catch(e){toast("PDF yaratib bo'lmadi")}
});

render();
(async()=>{
  try{db=await claude.use('db');usr=await claude.use('user');dl=await claude.use('downloads')}catch(e){}
  if(!db){$('#branches').innerHTML='<p class="empty">Umumiy ombor mavjud emas. Ilovani Claude hisobingiz orqali oching.</p>';return}
  try{uid=usr?await usr.id():null;canE=usr?(await usr.canEdit()||await usr.isOwner()):false;canW=usr?(await usr.can('data.write'))!==false:true}catch(e){}
  $('#drop').hidden=!canE;$('#clrBtn').hidden=!canE;$('#ren').hidden=!canE;
  $('#scanBox').hidden=!canW;$('#ro').hidden=canW;
  IDS.forEach(id=>subBranch(B[id]));
})();
</script>
